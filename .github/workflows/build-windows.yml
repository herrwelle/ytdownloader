name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller

      - name: Download deno runtime (Windows x64)
        shell: pwsh
        run: |
          curl -L -o deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-pc-windows-msvc.zip
          Expand-Archive deno.zip -DestinationPath deno-tmp
          New-Item -ItemType Directory -Force deno | Out-Null
          Copy-Item deno-tmp/deno.exe deno/deno.exe

      - name: Vendor bgutil-ytdlp-pot-provider server (v2.0.2)
        shell: pwsh
        run: |
          curl -L -o bgutil.zip https://github.com/Brainicism/bgutil-ytdlp-pot-provider/archive/refs/tags/2.0.2.zip
          Expand-Archive bgutil.zip -DestinationPath bgzip
          Copy-Item -Recurse bgzip/bgutil-ytdlp-pot-provider-2.0.2/server bgutil-server-tmp

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bgutil server deps
        shell: pwsh
        run: |
          Set-Location bgutil-server-tmp
          npm ci --omit=dev --ignore-scripts
          Set-Location ..

      - name: Download ffmpeg (Windows x64)
        shell: pwsh
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          Copy-Item "ff/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" .
          Copy-Item "ff/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe" .

      - name: Build with PyInstaller
        shell: cmd
        run: >
          pyinstaller --clean --noconfirm --windowed --name YTDownloader
          --icon assets/YTDownloader.ico
          --add-data "static;static"
          --add-data "bgutil-server-tmp;bgutil\server"
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          --add-binary "deno\deno.exe;deno"
          --collect-all yt_dlp
          --collect-all yt_dlp_plugins
          --copy-metadata bgutil-ytdlp-pot-provider
          --hidden-import webview.platforms.edgechromium
          run.py

      - name: Smoke test packaged runtime
        shell: pwsh
        run: |
          $ver = & dist\YTDownloader\_internal\deno\deno.exe run --allow-all dist\YTDownloader\_internal\bgutil\server\src\generate_once.ts --version
          Write-Host "generate_once version: $ver"
          if ("$ver" -notmatch '2\.0\.2') { exit 1 }

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: |
          mkdir Languages 2>nul
          curl -L -o Languages\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl
          choco install innosetup -y --no-progress
          iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows-Setup
          path: Output/YTDownloader-Setup.exe

      - name: Upload portable exe folder
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-Windows-Portable
          path: dist/YTDownloader/
